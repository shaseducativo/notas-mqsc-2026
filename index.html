<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Consulta de Notas 2026</title>

<link rel="icon" href="icon.png">

<link rel="apple-touch-icon" href="icon.png">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#1e3a5f">

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{

  margin:0;
  padding:0;

  min-height:100%;

  font-family:'Segoe UI', sans-serif;

  background:
  linear-gradient(
    135deg,
    #e8edf5,
    #dce6f2,
    #f4f7fb
  );

  color:#1e293b;
}

/* APP */

.app{

  width:100%;

  max-width:430px;

  margin:auto;

  padding:18px;
}

/* HEADER */

.header{

  text-align:center;

  margin-bottom:20px;
}

.logo-wrapper{

  background:white;

  width:120px;
  height:120px;

  margin:auto;

  border-radius:28px;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
  0 10px 25px rgba(0,0,0,0.08);
}

.logo{

  width:88px;

  object-fit:contain;
}

.header h1{

  margin-top:18px;
  margin-bottom:10px;

  color:#1e3a5f;

  font-size:30px;

  line-height:1.2;
}

.header p{

  margin:0;

  color:#64748b;

  font-size:17px;

  line-height:1.5;
}

/* CARD */

.card{

  background:white;

  border-radius:24px;

  padding:22px;

  margin-bottom:18px;

  box-shadow:
  0 8px 24px rgba(15,23,42,0.08);

  animation:fadeUp .4s ease;
}

@keyframes fadeUp{

  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* MENSAJE */

.mensaje{

  text-align:center;

  color:#475569;

  font-size:17px;

  line-height:1.6;

  margin-bottom:20px;
}

/* FORM */

.fila{

  display:flex;
  flex-direction:column;

  gap:16px;
}

select,
input{

  width:100%;

  border:none;

  background:#f1f5f9;

  border-radius:18px;

  padding:18px;

  font-size:20px;

  outline:none;

  transition:.2s;
}

select:focus,
input:focus{

  background:white;

  box-shadow:
  0 0 0 3px rgba(30,58,95,0.12);
}

/* BOTON */

.btn{

  width:100%;

  border:none;

  background:#1e3a5f;

  color:white;

  border-radius:18px;

  padding:18px;

  font-size:22px;

  font-weight:bold;

  cursor:pointer;

  transition:.2s;

  box-shadow:
  0 5px 15px rgba(0,0,0,0.12);
}

.btn:hover{

  background:#17304f;
}

.btn:active{

  transform:scale(.98);
}

/* RESULTADO */

.nombre{

  text-align:center;

  color:#1e3a5f;

  font-size:28px;

  font-weight:bold;

  line-height:1.3;

  margin-bottom:12px;
}

.curso{

  text-align:center;

  font-size:19px;

  color:#475569;

  margin-bottom:20px;
}

/* TABLA */

.tabla-container{

  overflow-x:auto;

  border-radius:18px;
}

table{

  width:100%;

  border-collapse:collapse;

  overflow:hidden;

  border-radius:18px;
}

th{

  background:#1e3a5f;

  color:white;

  padding:16px 10px;

  font-size:17px;
}

td{

  padding:16px 10px;

  border-bottom:1px solid #e2e8f0;

  text-align:center;

  font-size:17px;
}

tr:nth-child(even){

  background:#f8fafc;
}

/* ERROR */

.error{

  background:#fee2e2;

  color:#b91c1c;

  padding:20px;

  border-radius:18px;

  text-align:center;

  font-size:20px;

  font-weight:bold;
}

/* LOADER */

.loader{

  text-align:center;

  font-size:20px;

  color:#475569;
}

/* FOOTER */

.footer{

  text-align:center;

  color:#64748b;

  margin-top:20px;

  padding-bottom:20px;
}

.logo-footer{

  width:70px;

  margin-bottom:10px;
}

.footer-title{

  font-size:17px;

  font-weight:bold;

  color:#1e3a5f;

  margin-bottom:6px;
}

.footer-sub{

  font-size:14px;
}

/* RESPONSIVE */

@media(max-width:480px){

  .app{
    padding:14px;
  }

  .logo-wrapper{

    width:100px;
    height:100px;
  }

  .logo{
    width:72px;
  }

  .header h1{
    font-size:25px;
  }

  .header p{
    font-size:15px;
  }

  .mensaje{
    font-size:15px;
  }

  select,
  input{

    font-size:17px;

    padding:16px;
  }

  .btn{

    font-size:20px;

    padding:17px;
  }

  .nombre{
    font-size:23px;
  }

  .curso{
    font-size:17px;
  }

  th,
  td{

    font-size:14px;

    padding:14px 8px;
  }

  .error{
    font-size:17px;
  }

}

</style>

</head>

<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">

    <div class="logo-wrapper">

      <img
        src="https://i.postimg.cc/7ZQPPHqg/logo-oficial.jpg"
        class="logo"
      >

    </div>

    <h1>
      U.E. MARCELO QUIROGA SANTA CRUZ
    </h1>

    <p>
      Sistema Oficial de Consulta de Notas 2026
    </p>

  </div>

  <!-- BUSQUEDA -->

  <div class="card">

    <div class="mensaje">

      Ingrese el RUDE del estudiante y seleccione el curso.

    </div>

    <div class="fila">

      <select id="curso">

        <option value="">
          Seleccione Curso
        </option>

      </select>

      <input
        type="text"
        id="rude"
        placeholder="Ingrese RUDE"
        style="text-transform:uppercase"
      >

      <button
        class="btn"
        onclick="consultar()"
      >
        Buscar Notas
      </button>

    </div>

  </div>

  <!-- RESULTADO -->

  <div id="resultado"></div>

  <!-- FOOTER -->

  <div class="footer">

    <img
      src="https://i.postimg.cc/Bv63RdDK/logo-shas.png"
      class="logo-footer"
    >

    <div class="footer-title">

      Desarrollado por S.H.A.S. EDUCATIVO

    </div>

    <div class="footer-sub">

      Plataforma de Consulta de Notas 2026

    </div>

  </div>

</div>

<script>

// =========================
// CARGAR CURSOS
// =========================

const selectCurso =
document.getElementById("curso");

for(let grado = 1; grado <= 6; grado++){

  for(let i = 65; i <= 71; i++){

    let paralelo =
    String.fromCharCode(i);

    let curso =
    grado + paralelo;

    let option =
    document.createElement("option");

    option.value = curso;

    option.textContent = curso;

    selectCurso.appendChild(option);
  }
}

// =========================
// CONSULTAR
// =========================

function consultar(){

  const curso =
  document
  .getElementById("curso")
  .value
  .trim();

  const rude =
document
.getElementById("rude")
.value
.trim()
.toUpperCase();

  if(!curso || !rude){

    alert("Complete los datos");

    return;
  }

  document.getElementById("resultado").innerHTML =

  `
  <div class="card">

    <div class="loader">

      ⏳ Buscando notas...

    </div>

  </div>
  `;

  const callbackName =
  "jsonp_callback_" +
  Math.round(100000 * Math.random());

  window[callbackName] = function(data){

    mostrarResultado(data);

    delete window[callbackName];

    document.body.removeChild(script);
  };

  const script =
  document.createElement("script");

  script.src =
  "https://script.google.com/macros/s/AKfycby87kGLBPaqf7H6gm_ApGyODLieBpD0mfQ20Xzjhipqf-yFcvwIZBSl1GuFHh84hMQA/exec"
  + "?curso=" + encodeURIComponent(curso)
  + "&rude=" + encodeURIComponent(rude)
  + "&callback=" + callbackName;

  script.onerror = function(){

    document.getElementById("resultado").innerHTML =

    `
    <div class="error">

      Error al conectar con el servidor

    </div>
    `;
  };

  document.body.appendChild(script);
}

// =========================
// MOSTRAR RESULTADO
// =========================

function mostrarResultado(data){

  if(data.error){

    document.getElementById("resultado").innerHTML =

    `
    <div class="error">

      ${data.error}

    </div>
    `;

    return;
  }

  let html =

  `
  <div class="card">

    <div class="nombre">

      ${data.nombre}

    </div>

    <div class="curso">

      Curso: <b>${data.curso}</b>

    </div>

    <div class="tabla-container">

      <table>

        <tr>
          <th>Área</th>
          <th>1T</th>
          <th>2T</th>
          <th>3T</th>
          <th>Final</th>
        </tr>
  `;

  data.areas.forEach(a => {

    html +=

    `
    <tr>

      <td>
        <b>${a.area}</b>
      </td>

      <td>${a.t1}</td>

      <td>${a.t2}</td>

      <td>${a.t3}</td>

      <td>${a.anual}</td>

    </tr>
    `;
  });

  html +=

  `
      </table>

    </div>

  </div>
  `;

  document.getElementById("resultado").innerHTML =
  html;
}

if("serviceWorker" in navigator){

  navigator.serviceWorker
    .register("./sw.js");
}

</script>

</body>
</html>
